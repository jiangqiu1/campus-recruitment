server:
  port: 8080
  servlet:
    context-path: /api

spring:
  # 数据库配�?
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_recruitment?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000

  # Redis 配置
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 6000ms
    password: pass4Redis
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      enabled: true

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.recruit.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    call-setters-on-nulls: true
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: recruitment-platform-secret-key-2025
  expiration: 604800000  # 7天（毫秒�?
  header: Authorization
  prefix: "Bearer "

# 文件上传路径配置
file:
  upload-path: ${user.home}/uploads/
  avatar-path: ${file.upload-path}avatar/
  resume-path: ${file.upload-path}resume/
  base-url: http://localhost:8080/api/files/

# 日志配置
logging:
  level:
    com.recruit.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

